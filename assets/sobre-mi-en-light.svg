<svg xmlns="http://www.w3.org/2000/svg" width="860" height="384" viewBox="0 0 860 384" role="img" aria-labelledby="titulo desc"><title id="titulo">About me</title><desc id="desc">I'm in the second year of Multiplatform Application Development at IES Lázaro Cárdenas, having already completed the Higher Technician degree in Web Application Development. Where I enjoy myself most is on the server: designing the data model, deciding who can access what and serving it through a clear, maintainable API. In my course projects I've worked in teams with branches, pull requests and code review, a way of working I feel comfortable with.</desc><style>@font-face{font-family:'PT Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'PT Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'PT Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.cuerpo{font-family:'PT Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:400;font-size:15px;letter-spacing:0em}.etiqueta{font-family:'PT Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:400;font-size:11.5px;letter-spacing:0em}.meta{font-family:'PT Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:400;font-size:11px;letter-spacing:0.02em}.mono-pequeno{font-family:'PT Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:400;font-size:10.5px;letter-spacing:0.02em}.seccion{font-family:'PT Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:500;font-size:12px;letter-spacing:0.02em}@keyframes late{0%,100%{opacity:1}50%{opacity:0}}.la{animation:late 1.1s steps(1) infinite}@media (prefers-reduced-motion:reduce){.la{animation:none}}</style><rect x="0.5" y="0.5" width="859" height="383" rx="6" fill="#fdfafa" stroke="#ecdcdc"/><rect x="28" y="25" width="34.1" height="20" rx="3" fill="none" stroke="#800517"/><text x="34" y="39.5" class="seccion" fill="#800517">GET</text><text x="72.1" y="39.5" class="seccion" fill="#241b1c">/me</text><text x="832" y="39.5" text-anchor="end"><tspan class="meta" fill="#1a7f37">200 OK</tspan><tspan class="meta" fill="#6e6162"> · application/json</tspan></text><line x1="28" y1="60.5" x2="832" y2="60.5" stroke="#ecdcdc"/><text x="28" y="104" class="cuerpo" fill="#241b1c">I'm in the second year of Multiplatform Application</text><text x="28" y="128" class="cuerpo" fill="#241b1c">Development at IES Lázaro Cárdenas, having already</text><text x="28" y="152" class="cuerpo" fill="#241b1c">completed the Higher Technician degree in Web Application</text><text x="28" y="176" class="cuerpo" fill="#241b1c">Development.</text><text x="28" y="212" class="cuerpo" fill="#6e6162">Where I enjoy myself most is on the server: designing the</text><text x="28" y="236" class="cuerpo" fill="#6e6162">data model, deciding who can access what and serving it</text><text x="28" y="260" class="cuerpo" fill="#6e6162">through a clear, maintainable API.</text><text x="28" y="296" class="cuerpo" fill="#6e6162">In my course projects I've worked in teams with branches,</text><text x="28" y="320" class="cuerpo" fill="#6e6162">pull requests and code review, a way of working I feel</text><text x="28" y="344" class="cuerpo" fill="#6e6162">comfortable with.</text><rect x="513.5" y="122.5" width="309.1" height="199" rx="4" fill="#f8f0f0" stroke="#ecdcdc"/><text x="533.5" y="146.5" class="mono-pequeno" fill="#6e6162">response</text><circle cx="802.6" cy="142.5" r="3" fill="#800517"/><text x="533.5" y="172.5" xml:space="preserve"><tspan class="etiqueta" fill="#6e6162">{</tspan></text><text x="533.5" y="193.5" xml:space="preserve"><tspan class="etiqueta" fill="#6e6162">  </tspan><tspan class="etiqueta" fill="#800517">&quot;name&quot;</tspan><tspan class="etiqueta" fill="#6e6162">: </tspan><tspan class="etiqueta" fill="#241b1c">&quot;Pablo Torrecilla&quot;</tspan><tspan class="etiqueta" fill="#6e6162">,</tsp