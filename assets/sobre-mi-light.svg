<svg xmlns="http://www.w3.org/2000/svg" width="860" height="384" viewBox="0 0 860 384" role="img" aria-labelledby="titulo desc"><title id="titulo">Sobre mí</title><desc id="desc">Estudio el segundo curso de Desarrollo de Aplicaciones Multiplataforma en el IES Lázaro Cárdenas, con el título de Técnico Superior en Desarrollo de Aplicaciones Web ya completado. Donde más disfruto es en el servidor: diseñar el modelo de datos, decidir quién puede acceder a qué y ofrecerlo a través de una API clara y fácil de mantener. En los proyectos del ciclo he trabajado en equipo con ramas, pull requests y revisión de código, una forma de trabajar con la que me siento cómodo.</desc><style>@font-face{font-family:'PT Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'PT Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'PT Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.cuerpo{font-family:'PT Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:400;font-size:15px;letter-spacing:0em}.etiqueta{font-family:'PT Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:400;font-size:11.5px;letter-spacing:0em}.meta{font-family:'PT Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:400;font-size:11px;letter-spacing:0.02em}.mono-pequeno{font-family:'PT Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:400;font-size:10.5px;letter-spacing:0.02em}.seccion{font-family:'PT Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:500;font-size:12px;letter-spacing:0.02em}@keyframes late{0%,100%{opacity:1}50%{opacity:0}}.la{animation:late 1.1s steps(1) infinite}@media (prefers-reduced-motion:reduce){.la{animation:none}}</style><rect x="0.5" y="0.5" width="859" height="383" rx="6" fill="#fdfafa" stroke="#ecdcdc"/><rect x="28" y="25" width="34.1" height="20" rx="3" fill="none" stroke="#800517"/><text x="34" y="39.5" class="seccion" fill="#800517">GET</text><text x="72.1" y="39.5" class="seccion" fill="#241b1c">/me</text><text x="832" y="39.5" class="meta" fill="#6e6162" text-anchor="end">200 OK · application/json</text><line x1="28" y1="60.5" x2="832" y2="60.5" stroke="#ecdcdc"/><text x="28" y="104" class="cuerpo" fill="#241b1c">Estudio el segundo curso de Desarrollo de Aplicaciones</text><text x="28" y="128" class="cuerpo" fill="#241b1c">Multiplataforma en el IES Lázaro Cárdenas, con el título de</text><text x="28" y="152" class="cuerpo" fill="#241b1c">Técnico Superior en Desarrollo de Aplicaciones Web ya</text><text x="28" y="176" class="cuerpo" fill="#241b1c">completado.</text><text x="28" y="212" class="cuerpo" fill="#6e6162">Donde más disfruto es en el servidor: diseñar el modelo de</text><text x="28" y="236" class="cuerpo" fill="#6e6162">datos, decidir quién puede acceder a qué y ofrecerlo a</text><text x="28" y="260" class="cuerpo" fill="#6e6162">través de una API clara y fácil de mantener.</text><text x="28" y="296" class="cuerpo" fill="#6e6162">En los proyectos del ciclo he trabajado en equipo con ramas,</text><text x="28" y="320" class="cuerpo" fill="#6e6162">pull requests y revisión de código, una forma de trabajar con</text><text x="28" y="344" class="cuerpo" fill="#6e6162">la que me siento cómodo.</text><rect x="503.1" y="122.5" width="329.8" height="199" rx="4" fill="#f8f0f0" stroke="#ecdcdc"/><text x="523.1" y="146.5" class="mono-pequeno" fill="#6e6162">respuesta</text><circle cx="812.9" cy="142.5" r="3" fill="#800517"/><text x="523.1" y="172.5" xml:space="preserve"><tspan class="etiqueta" fill="#6e6162">{</tspan></text><text x="523.1" y="193.5" xml:space="preserve"><tspan class="etiqueta" fill="#6e6162">  </tspan><tspan class="etiqueta" fill="#800517">&quot;nombre&quot;</tspan><tspan class="etiqueta" fill="#6e6162">: </tspan><tspan class="etiqueta" fill="#241b1c">&quot;Pablo Torrecilla&quot;</tspan><tspan class="etiqueta" fill="#6e6162">,</tspan></text><text x="523.1" y="214.5" xml:space="preserve"><tspan class="etiqueta" fill="#6e6162">  </tspan><tspan class="etiqueta" fill="#800517">&quot;curso&quot;</tspan><tspan class="etiqueta" fill="#6e6162">: </tspan><tspan class="etiqueta" fill="#241b1c">&quot;2.º DAM&quot;</tspan><tspan class="etiqueta" fill="#6e6162">,</tspan></text><text x="523.1" y="235.5" xml:space="preserve"><tspan class="etiqueta" fill="#6e6162">  </tspan><tspan class="etiqueta" fill="#800517">&quot;titulacion&quot;</tspan><tspan class="etiqueta" fill="#6e6162">: </tspan><tspan class="etiqueta" fill="#241b1c">&quot;Técnico Superior en DAW&quot;</tspan><tspan class="etiqueta" fill="#6e6162">,</tspan></text><text x="523.1" y="256.5" xml:space="preserve"><tspan class="etiqueta" fill="#6e6162">  </tspan><tspan class="etiqueta" fill="#800517">&quot;ubicacion&quot;</tspan><tspan class="etiqueta" fill="#6e6162">: </tspan><tspan class="etiqueta" fill="#241b1c">&quot;Madrid, España&quot;</tspan><tspan class="etiqueta" fill="#6e6162">,</tspan></text><text x="523.1" y="277.5" xml:space="preserve"><tspan class="etiqueta" fill="#6e6162">  </tspan><tspan class="etiqueta" fill="#800517">&quot;enfoque&quot;</tspan><tspan class="etiqueta" fill="#6e6162">: </tspan><tspan class="etiqueta" fill="#6e6162">[</tspan><tspan class="etiqueta" fill="#241b1c">&quot;backend&quot;</tspan><tspan class="etiqueta" fill="#6e6162">, </tspan><tspan class="etiqueta" fill="#241b1c">&quot;web&quot;</tspan><tspan class="etiqueta" fill="#6e6162">]</tspan><tspan class="etiqueta" fill="#6e6162"></tspan></text><text x="523.1" y="298.5" xml:space="preserve"><tspan class="etiqueta" fill="#6e6162">}</tspan></text></svg>
